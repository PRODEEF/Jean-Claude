<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maquette mobile - Jean-Claude</title>
<style>
  :root {
    --surface-0: #e8f2fa;
    --surface-1: #f3f9fd;
    --surface-2: #ffffff;
    --text-primary: #16232e;
    --text-secondary: #52616b;
    --text-muted: #8598a3;
    --border: rgba(12,73,127,0.12);
    --border-strong: rgba(12,73,127,0.26);
    --accent-bg: #dbeefd;
    --accent-text: #0c497f;
    --brand: #0059f4;
    --success: #3b6d11;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--surface-0);
    color: var(--text-primary);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .hint {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--text-muted); text-align: center;
  }

  .phone {
    width: 375px; height: 812px; background: #16181c; border-radius: 44px;
    padding: 10px; box-shadow: 0 24px 60px rgba(12,20,28,0.28); position: relative; flex-shrink: 0;
  }
  .screen {
    width: 100%; height: 100%; background: var(--surface-2); border-radius: 34px;
    overflow: hidden; position: relative; display: flex; flex-direction: column;
  }
  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px 4px; font-size: 13px; font-weight: 600; flex-shrink: 0;
  }

  .app-header {
    background: var(--brand); color: #fff; display: flex; align-items: center;
    justify-content: space-between; padding: 12px 14px; flex-shrink: 0;
  }
  .burger-btn, .newconv-btn {
    width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff;
    flex-shrink: 0;
  }
  .burger-btn:hover, .newconv-btn:hover { background: rgba(255,255,255,0.15); }
  .newconv-btn { border: 1.6px solid #fff; }
  .burger-btn span { display: block; width: 16px; height: 2.2px; background: #fff; border-radius: 2px; }
  .burger-btn span + span { margin-top: 4px; }
  #header-title-wrap { text-align: center; flex: 1; min-width: 0; padding: 0 6px; }
  #header-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #header-subtitle { font-size: 10px; color: #cfe0ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .chat-body { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
  .chat-welcome {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 8px;
  }
  .chat-welcome-title { font-size: 17px; font-weight: 700; margin: 0; color: var(--text-primary); }
  .chat-welcome-sub { font-size: 12px; color: var(--text-muted); margin: 0; }
  .bubble-ai {
    align-self: flex-start; max-width: 82%; font-size: 13px; line-height: 1.5;
    background: var(--accent-bg); color: var(--accent-text); border-radius: 12px; padding: 10px 12px;
  }
  .bubble-user {
    align-self: flex-end; max-width: 82%; font-size: 13px; line-height: 1.5;
    background: var(--brand); color: #fff; border-radius: 12px; padding: 10px 12px;
  }
  .jc-suggestions-row { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .jc-suggestion-chip {
    background: #ffffff; color: var(--accent-text); border: 1px solid var(--border-strong);
    padding: 6px 10px; border-radius: 999px; font-size: 11.5px; cursor: pointer;
  }
  .jc-suggestion-chip:hover { background: var(--surface-1); }

  .input-row { flex-shrink: 0; padding: 10px 14px 18px; display: flex; align-items: center; gap: 8px; }
  #mobile-input {
    flex: 1; height: 38px; border-radius: 19px; border: 1px solid var(--border);
    background: var(--surface-1); padding: 0 14px; font-size: 13px; outline: none;
  }
  .mic-btn, .send-btn {
    width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--brand);
    color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .mic-btn:hover, .send-btn:hover { filter: brightness(1.08); }
  .mic-btn.listening { animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(0,89,244,0.5); } 50% { box-shadow: 0 0 0 7px rgba(0,89,244,0); } }
  .voice-note { text-align: center; font-size: 10px; color: var(--text-muted); margin: -6px 0 4px; }

  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 4px; border-radius: 2px; background: rgba(22,24,28,0.22); z-index: 10;
  }

  .drawer-scrim {
    position: absolute; inset: 0; background: rgba(11,12,16,0.42);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 20;
  }
  .drawer-scrim.open { opacity: 1; pointer-events: auto; }
  .drawer-panel {
    position: absolute; top: 0; left: 0; bottom: 0; width: 82%; max-width: 300px;
    background: var(--surface-2); transform: translateX(-102%); transition: transform 0.25s ease;
    z-index: 21; display: flex; flex-direction: column; box-shadow: 6px 0 24px rgba(12,20,28,0.18);
  }
  .drawer-panel.open { transform: translateX(0); }
  .drawer-scroll { flex: 1; overflow-y: auto; padding: 44px 14px 10px; }
  .drawer-search {
    display: flex; align-items: center; gap: 8px; height: 36px; border-radius: 18px;
    background: var(--surface-1); border: 1px solid var(--border); padding: 0 12px; margin-bottom: 14px;
  }
  .drawer-search input { flex: 1; border: none; background: transparent; outline: none; font-size: 13px; }
  .drawer-newconv {
    display: flex; align-items: center; gap: 10px; background: var(--accent-bg); color: var(--accent-text);
    border-radius: var(--radius); padding: 10px 10px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 10px;
  }
  .drawer-newconv:hover { filter: brightness(0.97); }
  .drawer-newconv .plus-dot {
    width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
  }
  .drawer-jc-entry {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius);
    cursor: pointer; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--text-primary);
  }
  .drawer-jc-entry:hover { background: var(--surface-1); }
  .drawer-jc-avatar {
    width: 24px; height: 24px; border-radius: 6px; background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700; flex-shrink: 0;
  }
  .drawer-divider { border: none; border-top: 1px solid var(--border); margin: 8px 0 10px; }

  .drawer-badge { background: var(--brand); color: #fff; font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.03em; padding: 6px 10px; border-radius: 6px 6px 0 0; }
  .drawer-folder-block { border: 1px solid var(--border); border-top: none; border-radius: 0 0 6px 6px; margin-bottom: 10px; overflow: hidden; }
  .drawer-folder-header {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px; cursor: pointer;
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; color: var(--text-secondary);
  }
  .drawer-folder-header:hover { background: var(--surface-1); }
  .drawer-folder-header.active-folder { background: var(--accent-bg); color: var(--accent-text); }
  .drawer-chevron { font-size: 9px; transition: transform 0.15s; display: inline-block; flex-shrink: 0; }
  .drawer-chevron.open { transform: rotate(90deg); }
  .drawer-conv-list { display: flex; flex-direction: column; }
  .drawer-conv-row {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 26px; font-size: 12.5px;
    cursor: pointer; color: var(--text-primary); border-top: 1px solid var(--border);
  }
  .drawer-conv-row:hover { background: var(--surface-1); }
  .drawer-conv-row.active { background: var(--accent-bg); color: var(--accent-text); font-weight: 600; }
  .drawer-conv-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); flex-shrink: 0; }
  .drawer-search-result-folder { font-size: 10.5px; color: var(--text-muted); margin-left: auto; flex-shrink: 0; }
  .drawer-empty { font-size: 12px; color: var(--text-muted); font-style: italic; padding: 6px 10px 10px 26px; }

  .drawer-account {
    flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-top: 1px solid var(--border);
  }
  .drawer-account-avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .drawer-account-name { font-size: 12.5px; font-weight: 700; color: var(--text-primary); }
  .drawer-account-status { font-size: 10.5px; color: var(--success); }
</style>
</head>
<body>

<div class="hint">Maquette mobile cliquable — burger en haut à gauche pour ouvrir le menu</div>

<div class="phone">
  <div class="screen">
    <div class="status-bar"><span id="clock">14:01</span><span></span></div>

    <div class="app-header">
      <button class="burger-btn" id="burger-btn" aria-label="Ouvrir le menu"><span></span><span></span><span></span></button>
      <div id="header-title-wrap">
        <div id="header-title">Jean-Claude</div>
        <div id="header-subtitle" style="display:none;"></div>
      </div>
      <button class="newconv-btn" id="newconv-btn" aria-label="Nouvelle conversation">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div class="chat-body" id="chat-body"></div>

    <div class="voice-note">Saisie et réponses vocales disponibles</div>
    <div class="input-row">
      <input type="text" id="mobile-input" placeholder="Écris ou parle à Jean-Claude…" />
      <button class="mic-btn" id="mic-btn" aria-label="Message vocal">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v1a7 7 0 0 0 14 0v-1"></path><path d="M12 19v3"></path></svg>
      </button>
      <button class="send-btn" id="send-btn" aria-label="Envoyer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
      </button>
    </div>

    <div class="home-indicator"></div>

    <div class="drawer-scrim" id="drawer-scrim"></div>
    <div class="drawer-panel" id="drawer-panel">
      <div class="drawer-scroll">
        <div class="drawer-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted);flex-shrink:0;"><circle cx="10" cy="10" r="7"></circle><path d="M21 21l-6-6"></path></svg>
          <input type="text" id="drawer-search-input" placeholder="Rechercher" />
        </div>
        <div class="drawer-newconv" id="drawer-newconv-btn">
          <span class="plus-dot">+</span><span>Nouvelle conversation</span>
        </div>
        <div class="drawer-jc-entry" id="drawer-jc-entry">
          <span class="drawer-jc-avatar">JC</span><span>Jean-Claude</span>
        </div>
        <hr class="drawer-divider" />
        <div id="drawer-folders"></div>
      </div>
      <div class="drawer-account">
        <span class="drawer-account-avatar">YL</span>
        <div>
          <div class="drawer-account-name">Yann</div>
          <div class="drawer-account-status">En ligne</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const state = {
  folders: [
    { id: 'vie-perso', name: 'Vie perso', convs: ['Vacances août', 'Suivi santé', 'Déménagement'], expanded: true },
    { id: 'finance', name: 'Finance', convs: ['Budget T3', 'Relance factures'], expanded: false },
    { id: 'marketing', name: 'Marketing', convs: ['Campagne rentrée', 'Idées posts LinkedIn'], expanded: false },
    { id: 'rh', name: 'RH', convs: ['Entretien annuel'], expanded: false }
  ],
  activeFolder: null,
  activeConv: null,
  mode: 'welcome' // 'welcome' | 'conv' | 'jc'
};

function findFolder(id) { return state.folders.find(f => f.id === id) || null; }
function allConvs() {
  const rows = [];
  state.folders.forEach(f => f.convs.forEach(c => rows.push({ conv: c, folder: f })));
  return rows;
}

function welcomeBodyHtml() {
  return '<div class="chat-welcome">' +
    '<p class="chat-welcome-title">Bonjour Yann,</p>' +
    '<p class="chat-welcome-title" style="margin-top:-6px;">qu\'est-ce qu\'on fait aujourd\'hui ?</p>' +
    '<p class="chat-welcome-sub">Écris ou parle pour commencer.</p>' +
    '</div>';
}

const SANTE_BODY_HTML =
  '<div class="bubble-ai">Voici le suivi de tes derniers rendez-vous santé.</div>' +
  '<div class="bubble-user">Merci ! Et le prochain rdv kiné ?</div>' +
  '<div class="bubble-ai">Rdv kiné récurrent chaque mardi 18h, ajouté à ton calendrier avec rappel.</div>';

const DEFAULT_CONV_BODY_HTML =
  '<div class="bubble-user">Propose-moi un itinéraire de 5 jours en Bretagne.</div>' +
  '<div class="bubble-ai">Voici une trame simple : jour 1 Saint-Malo, jour 2 Mont-Saint-Michel, jour 3 Dinan, jour 4 Cap Fréhel, jour 5 retour via Rennes. Je peux détailler chaque étape si tu veux.</div>';

const JC_SUGGESTION_REPLIES = {
  relation: "Parfait. Je peux m'adapter à ton rythme, te relancer plus ou moins souvent selon les périodes, ou rester plus en retrait. Dis-moi ce qui te conviendrait.",
  matin: "Noté. Chaque matin, je regarderai ta semaine (rendez-vous, todos datées, échéances) et je te ferai un point rapide, surtout en début de semaine. Réglable dans les paramètres."
};

function jcSuggestionClick(key) {
  const wrap = document.getElementById('chat-body');
  const userText = key === 'relation' ? 'Oui, je veux bien que notre relation évolue.' : 'Oui, préviens-moi le matin.';
  wrap.insertAdjacentHTML('beforeend',
    '<div class="bubble-user">' + userText + '</div><div class="bubble-ai">' + JC_SUGGESTION_REPLIES[key] + '</div>');
  wrap.scrollTop = wrap.scrollHeight;
}

function updateHeader() {
  const title = document.getElementById('header-title');
  const sub = document.getElementById('header-subtitle');
  if (state.mode === 'conv') {
    const folder = findFolder(state.activeFolder);
    title.textContent = state.activeConv;
    sub.textContent = folder ? folder.name : '';
    sub.style.display = 'block';
  } else if (state.mode === 'jc') {
    title.textContent = 'Jean-Claude';
    sub.style.display = 'none';
  } else {
    title.textContent = 'Jean-Claude';
    sub.style.display = 'none';
  }
}

function renderBody() {
  const body = document.getElementById('chat-body');
  if (state.mode === 'welcome') {
    body.innerHTML = welcomeBodyHtml();
  } else if (state.mode === 'jc') {
    body.innerHTML = '<div class="bubble-ai">Bonjour Yann. Ici c\'est notre fil permanent : organisation, structure des dossiers, rappels de ce que tu as à faire.' +
      '<div class="jc-suggestions-row">' +
        '<button class="jc-suggestion-chip" onclick="jcSuggestionClick(\'relation\')">Veux-tu que notre relation évolue ?</button>' +
        '<button class="jc-suggestion-chip" onclick="jcSuggestionClick(\'matin\')">Veux-tu que je te prévienne le matin ?</button>' +
      '</div></div>';
  } else {
    body.innerHTML = state.activeConv === 'Suivi santé' ? SANTE_BODY_HTML : DEFAULT_CONV_BODY_HTML;
  }
  body.scrollTop = 0;
}

function newConversation() {
  state.mode = 'welcome';
  state.activeConv = null;
  state.activeFolder = null;
  updateHeader();
  renderBody();
  closeDrawer();
  document.getElementById('mobile-input').focus();
}

function openConversation(folderId, name) {
  const folder = findFolder(folderId);
  if (folder) folder.expanded = true;
  state.mode = 'conv';
  state.activeFolder = folderId;
  state.activeConv = name;
  updateHeader();
  renderBody();
  closeDrawer();
  renderDrawerFolders();
}

function openJeanClaude() {
  state.mode = 'jc';
  state.activeConv = null;
  state.activeFolder = null;
  updateHeader();
  renderBody();
  closeDrawer();
}

function openDrawer() {
  document.getElementById('drawer-scrim').classList.add('open');
  document.getElementById('drawer-panel').classList.add('open');
  const search = document.getElementById('drawer-search-input');
  search.value = '';
  renderDrawerFolders('');
}
function closeDrawer() {
  document.getElementById('drawer-scrim').classList.remove('open');
  document.getElementById('drawer-panel').classList.remove('open');
}
function toggleDrawer() {
  document.getElementById('drawer-panel').classList.contains('open') ? closeDrawer() : openDrawer();
}

function renderDrawerFolders(filter) {
  const wrap = document.getElementById('drawer-folders');
  const q = (filter || '').trim().toLowerCase();
  wrap.innerHTML = '';

  if (q) {
    const rows = allConvs().filter(r => r.conv.toLowerCase().includes(q) || r.folder.name.toLowerCase().includes(q));
    if (!rows.length) {
      wrap.innerHTML = '<div class="drawer-empty">Aucun résultat.</div>';
      return;
    }
    rows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'drawer-conv-row' + (r.conv === state.activeConv ? ' active' : '');
      row.style.padding = '9px 10px';
      row.innerHTML = '<span class="drawer-conv-dot"></span><span>' + r.conv + '</span><span class="drawer-search-result-folder">' + r.folder.name + '</span>';
      row.onclick = () => openConversation(r.folder.id, r.conv);
      wrap.appendChild(row);
    });
    return;
  }

  const badge = document.createElement('div');
  badge.className = 'drawer-badge';
  badge.textContent = 'PERSONNEL';
  wrap.appendChild(badge);

  const groupWrap = document.createElement('div');
  groupWrap.style.marginBottom = '10px';
  groupWrap.style.border = '1px solid var(--border)';
  groupWrap.style.borderTop = 'none';
  groupWrap.style.borderRadius = '0 0 6px 6px';
  groupWrap.style.overflow = 'hidden';

  state.folders.forEach(folder => {
    const block = document.createElement('div');
    const isOpen = !!folder.expanded;
    const header = document.createElement('div');
    header.className = 'drawer-folder-header' + (folder.id === state.activeFolder ? ' active-folder' : '');
    header.innerHTML = '<span class="drawer-chevron' + (isOpen ? ' open' : '') + '">▸</span><span>' + folder.name + '</span>';
    header.onclick = () => { folder.expanded = !isOpen; renderDrawerFolders(''); };
    block.appendChild(header);

    if (isOpen) {
      if (folder.convs.length) {
        const list = document.createElement('div');
        list.className = 'drawer-conv-list';
        folder.convs.forEach(name => {
          const row = document.createElement('div');
          const active = name === state.activeConv && folder.id === state.activeFolder;
          row.className = 'drawer-conv-row' + (active ? ' active' : '');
          row.innerHTML = '<span class="drawer-conv-dot"></span><span>' + name + '</span>';
          row.onclick = () => openConversation(folder.id, name);
          list.appendChild(row);
        });
        block.appendChild(list);
      } else {
        const empty = document.createElement('div');
        empty.className = 'drawer-empty';
        empty.textContent = 'Aucune conversation.';
        block.appendChild(empty);
      }
    }
    groupWrap.appendChild(block);
  });
  wrap.appendChild(groupWrap);
}

function sendMessage() {
  const input = document.getElementById('mobile-input');
  const text = input.value.trim();
  if (!text) return;
  if (state.mode === 'welcome') {
    state.mode = 'conv';
    state.activeConv = 'Nouvelle conversation';
    updateHeader();
    document.getElementById('chat-body').innerHTML = '';
  }
  const body = document.getElementById('chat-body');
  body.insertAdjacentHTML('beforeend', '<div class="bubble-user">' + text.replace(/</g, '&lt;') + '</div>');
  input.value = '';
  body.scrollTop = body.scrollHeight;
  setTimeout(() => {
    body.insertAdjacentHTML('beforeend', '<div class="bubble-ai">D\'accord, je m\'en occupe.</div>');
    body.scrollTop = body.scrollHeight;
  }, 500);
}

function toggleMic() {
  const btn = document.getElementById('mic-btn');
  btn.classList.add('listening');
  setTimeout(() => btn.classList.remove('listening'), 1200);
}

document.getElementById('burger-btn').onclick = toggleDrawer;
document.getElementById('newconv-btn').onclick = newConversation;
document.getElementById('drawer-newconv-btn').onclick = newConversation;
document.getElementById('drawer-jc-entry').onclick = openJeanClaude;
document.getElementById('drawer-scrim').onclick = closeDrawer;
document.getElementById('drawer-search-input').addEventListener('input', (e) => renderDrawerFolders(e.target.value));
document.getElementById('send-btn').onclick = sendMessage;
document.getElementById('mic-btn').onclick = toggleMic;
document.getElementById('mobile-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

updateHeader();
renderBody();
renderDrawerFolders('');
</script>
</body>
</html>
